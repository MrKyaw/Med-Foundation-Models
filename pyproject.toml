[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medfm"
version = "0.1.0"
description = "Foundation Models for Whole-Body MRI: Self-Supervised Learning, Multimodal Fusion & Clinical Translation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MrKyaw", email = "mr.kyaw@example.com"}
]
requires-python = ">=3.10"
keywords = [
    "foundation-models",
    "whole-body-mri",
    "self-supervised-learning",
    "masked-image-modeling",
    "contrastive-learning",
    "jepa",
    "vision-transformer",
    "multimodal-learning",
    "vision-language-model",
    "medical-imaging",
    "medical-image-analysis",
    "mri",
    "clinical-ai",
    "representation-learning",
    "knowledge-distillation",
    "longitudinal-modeling",
    "biomarker-extraction",
    "agentic-ai",
    "llm-adaptation",
    "pytorch",
    "production-ml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.12",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "nibabel>=5.1.0",
    "SimpleITK>=2.3.0",
    "h5py>=3.9.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "tensorboard>=2.14.0",
    "einops>=0.7.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/MrKyaw/Med-Foundation-Models"
Repository = "https://github.com/MrKyaw/Med-Foundation-Models.git"
Issues = "https://github.com/MrKyaw/Med-Foundation-Models/issues"
Documentation = "https://github.com/MrKyaw/Med-Foundation-Models#readme"

[tool.setuptools.packages.find]
include = ["medfm*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
